<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>edumerge Admission CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 2rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/dashboard">Edumerge CRM</a>
    <div class="collapse navbar-collapse" id="navbarNav">
      
      <!-- Removed all the confusing hidden <li> links from here -->
      <ul class="navbar-nav me-auto"></ul>
      
      <!-- Authenticated User Section -->
      <div class="d-flex align-items-center text-white gap-3">
          {% if current_user %}
              <span>
                  <strong>{{ current_user.display_name }}</strong>
                  <span class="badge bg-{% if current_user.role == 'admin' %}primary{% elif current_user.role == 'officer' %}success{% else %}secondary{% endif %} ms-1">{{ current_user.role }}</span>
              </span>
              <form method="post" action="/logout" class="m-0">
                  <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
              </form>
          {% else %}
              <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
          {% endif %}
      </div>

    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 1. On page load, make sure the dropdown matches the page we are currently on
    const currentPath = window.location.pathname;
    const selector = document.getElementById('roleSelector');
    
    for(let i = 0; i < selector.options.length; i++) {
        if(selector.options[i].value === currentPath || (currentPath === '/' && selector.options[i].value === '/dashboard')) {
            selector.selectedIndex = i;
            break;
        }
    }

    // 2. When user changes their role, instantly navigate them to their dedicated portal
    function switchRole(url) {
        window.location.href = url;
    }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
