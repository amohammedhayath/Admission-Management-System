<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admission Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card shadow login-card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Admission Management System</h3>
                <h5 class="text-center text-muted mb-4">Please sign in</h5>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post" action="/login">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Enter username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>

                <hr class="my-4">
                <p class="text-muted text-center small mb-0">Demo Credentials</p>
                <div class="mt-2">
                    <table class="table table-sm table-bordered small mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>User</th>
                                <th>Password</th>
                                <th>Role</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><code>admin</code></td>
                                <td><code>admin123</code></td>
                                <td><span class="badge bg-primary">Admin</span></td>
                            </tr>
                            <tr>
                                <td><code>officer</code></td>
                                <td><code>officer123</code></td>
                                <td><span class="badge bg-success">Officer</span></td>
                            </tr>
                            <tr>
                                <td><code>viewer</code></td>
                                <td><code>viewer123</code></td>
                                <td><span class="badge bg-secondary">Viewer</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
</body>
</html>
